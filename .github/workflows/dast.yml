name: "DAST Scan"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

jobs:
  dast-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Start application
        run: docker compose up -d

      - name: Wait for application
        run: |
          echo "Waiting for application..."
          for i in {1..60}; do
            if curl -s -f -o /dev/null http://localhost:8080; then
              echo "✅ Application is ready!"
              exit 0
            fi
            echo -n "."
            sleep 2
          done
          echo "❌ Timeout after 60 seconds"
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874
        with:
          target: "http://localhost:8080"

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0
        if: always()
        with:
          sarif_file: zap-results.sarif

name: "SCA Scan"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sca-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Run Trivy SCA
        id: trivy_scan
        uses: aquasecurity/trivy-action@d43c83b2b1ef7f7a6a7b22f542f5fd58b9ba600d
        continue-on-error: true
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          scanners: "vulnerability"

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@e2b4f0d4c27344f6bd09bf28f22e755f8ea5c2b7
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
